name: Phase 1 - Pure blu-spark Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: blu_spark-16-custom
          path: kernel_source
          fetch-depth: 1

      - name: Setup Proton-Clang Toolchain
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Build Pure Kernel
        run: |
          set -euo pipefail

          CLANG_DIR="${GITHUB_WORKSPACE}/toolchain/proton-clang"
          export PATH="${CLANG_DIR}/bin:${PATH}"

          cd kernel_source

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          OUT_DIR="${GITHUB_WORKSPACE}/out"
          mkdir -p "${OUT_DIR}"

          echo "========================================"
          echo "1. 自动定位配置文件 (defconfig)"
          echo "========================================"

          # 自动寻找适配 lemonadep / lahaina / blu_spark 的 defconfig
          DEFCONFIG_TARGET=$(find arch/arm64/configs/ -type f \( -name "*lemonadep*" -o -name "*lahaina*" -o -name "*blu_spark*" \) | head -n 1 | sed 's#arch/arm64/configs/##')

          if [ -z "${DEFCONFIG_TARGET}" ]; then
            echo "ERROR: 未在 arch/arm64/configs/ 中找到适配的配置文件！"
            echo "现有配置文件清单："
            find arch/arm64/configs/ -type f
            exit 1
          fi

          echo "成功匹配到配置文件: ${DEFCONFIG_TARGET}"

          echo "========================================"
          echo "2. 生成内核配置 (.config)"
          echo "========================================"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O="${OUT_DIR}" \
            "${DEFCONFIG_TARGET}"

          echo "========================================"
          echo "3. 开始编译纯内核"
          echo "========================================"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O="${OUT_DIR}" \
            -j$(nproc)

          echo "========================================"
          echo "4. 检查构建产物"
          echo "========================================"

          if [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "SUCCESS: 纯内核编译成功！产物: Image.gz-dtb"
          elif [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz" ] || [ -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then
            echo "SUCCESS: 纯内核编译成功！"
          else
            echo "ERROR: 未在产物目录找到内核镜像"
            exit 1
          fi

      - name: Upload Pure Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pure-blu_spark-Kernel
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtb*
