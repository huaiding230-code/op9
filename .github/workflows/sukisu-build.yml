name: Phase 2 - Integrated SukiSU Ultra + SUSFS Kernel Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: blu_spark-16-custom
          path: kernel_source
          fetch-depth: 1

      - name: Setup Proton-Clang Toolchain
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Integrate SukiSU Ultra + SUSFS
        run: |
          set -euo pipefail
          cd kernel_source

          echo "========================================"
          echo "1. 克隆 SukiSU Ultra 与 susfs4ksu"
          echo "========================================"
          rm -rf /tmp/SukiSU-Ultra /tmp/susfs4ksu

          git clone --depth=1 -b v0.12.3 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git /tmp/SukiSU-Ultra || \
          git clone --depth=1 -b v1.0.3 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git /tmp/SukiSU-Ultra || \
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git /tmp/SukiSU-Ultra

          SUSFS_BRANCH=$(git ls-remote --heads https://github.com/Star-Seven/susfs4ksu.git | grep -i '5\.4' | head -n 1 | awk '{print $2}' | sed 's#refs/heads/##' || true)
          if [ -n "${SUSFS_BRANCH}" ]; then
            echo "[+] 成功定位到 SUSFS 5.4 分支: ${SUSFS_BRANCH}"
            git clone --depth=1 -b "${SUSFS_BRANCH}" https://github.com/Star-Seven/susfs4ksu.git /tmp/susfs4ksu
          else
            echo "[+] 未找到 5.4 独立分支，拉取 susfs4ksu 默认主分支"
            git clone --depth=1 https://github.com/Star-Seven/susfs4ksu.git /tmp/susfs4ksu
          fi

          echo "========================================"
          echo "2. 还原 DTS 目录"
          echo "========================================"
          if [ -d "arch/arm64/boot/dts/vendor/oplus" ]; then
            git checkout -- arch/arm64/boot/dts/vendor/oplus/ || true
          fi

          echo "========================================"
          echo "3. 植入 SukiSU Ultra 驱动与 5.4 兼容补丁"
          echo "========================================"
          bash /tmp/SukiSU-Ultra/kernel/setup.sh main

          # 3.1 自动补齐 5.4 内核缺失的 linux/pgtable.h
          if [ ! -f "include/linux/pgtable.h" ]; then
            echo "[+] 创建 linux/pgtable.h 兼容垫片"
            mkdir -p include/linux
            echo -e "#ifndef _LINUX_PGTABLE_H\n#define _LINUX_PGTABLE_H\n#include <asm/pgtable.h>\n#endif" > include/linux/pgtable.h
          fi

          # 3.2 修复 pkg_observer.c (5.4 fsnotify 接口)
          RAW_OBSERVER=$(find -L drivers/kernelsu /tmp/SukiSU-Ultra -name "pkg_observer.c" 2>/dev/null | head -n 1 || true)
          if [ -n "$RAW_OBSERVER" ]; then
            PKG_OBSERVER=$(readlink -f "$RAW_OBSERVER")
            echo "[+] 找到 pkg_observer.c: $PKG_OBSERVER"
            if [ -f "$PKG_OBSERVER" ] && grep -q "handle_inode_event" "$PKG_OBSERVER"; then
              echo "[+] 适配 5.4 fsnotify 结构体"
              sed -i '/struct fsnotify_ops/i static int ksu_handle_event(struct fsnotify_group *group, struct inode *to_tell, u32 mask, const void *data, int data_type, const struct qstr *file_name, u32 cookie, struct fsnotify_iter_info *iter_info) { return ksu_handle_inode_event(NULL, mask, to_tell, NULL, file_name, cookie); }' "$PKG_OBSERVER"
              sed -i 's/.*\.handle_inode_event.*/\t\.handle_event = ksu_handle_event,/' "$PKG_OBSERVER"
            fi
          fi

          # 3.3 修复 allowlist.c (5.4 缺失 TWA_RESUME 与 task.h)
          RAW_ALLOWLIST=$(find -L drivers/kernelsu /tmp/SukiSU-Ultra -name "allowlist.c" 2>/dev/null | head -n 1 || true)
          if [ -n "$RAW_ALLOWLIST" ]; then
            ALLOWLIST_FILE=$(readlink -f "$RAW_ALLOWLIST")
            echo "[+] 找到 allowlist.c: $ALLOWLIST_FILE，补充 5.4 兼容头文件与 TWA_RESUME"
            sed -i '1i #include <linux/sched/task.h>\n#include <linux/task_work.h>\n#ifndef TWA_RESUME\n#define TWA_RESUME 1\n#endif' "$ALLOWLIST_FILE"
          fi

          # 3.4 修复 rules.c (5.4 内核 SELinux 锁机制)
          RAW_RULES=$(find -L drivers/kernelsu /tmp/SukiSU-Ultra -name "rules.c" 2>/dev/null | head -n 1 || true)
          if [ -n "$RAW_RULES" ]; then
            RULES_FILE=$(readlink -f "$RAW_RULES")
            echo "[+] 找到 rules.c: $RULES_FILE，修正 5.4 SELinux 锁"
            sed -i 's/mutex_lock(&selinux_state.ss_mutex);/write_lock(\&selinux_state.ss->policy_lock);/g' "$RULES_FILE" || true
            sed -i 's/mutex_unlock(&selinux_state.ss_mutex);/write_unlock(\&selinux_state.ss->policy_lock);/g' "$RULES_FILE" || true
            sed -i 's/selinux_state.ss_mutex/selinux_state.ss->policy_lock/g' "$RULES_FILE" || true
          fi

          echo "========================================"
          echo "4. 从 susfs4ksu 提取源码文件"
          echo "========================================"
          SUSFS_C=$(find /tmp/susfs4ksu -name "susfs.c" | head -n 1)
          if [ -n "$SUSFS_C" ]; then
            cp "$SUSFS_C" fs/
          else
            echo "[-] 错误: 未在 susfs4ksu 中找到 susfs.c" && exit 1
          fi
          find /tmp/susfs4ksu -name "susfs*.h" -exec cp {} include/linux/ \;

          echo "========================================"
          echo "5. 应用 5.4 内核 SUSFS VFS 补丁"
          echo "========================================"
          echo "[+] 列出 susfs4ksu 仓库中的所有补丁文件："
          find /tmp/susfs4ksu -type f -name "*.patch" || true

          # 1. 优先在文件路径或文件名中精准匹配 5.4 / 5_4
          SUSFS_PATCH=$(find /tmp/susfs4ksu -type f -name "*.patch" | grep -iE "5[\._]4" | head -n 1 || true)

          # 2. 若处于 5.4 专属分支中（文件名无 5.4 标识），自动退守选取分支内的 vfs/susfs 补丁
          if [ -z "$SUSFS_PATCH" ]; then
            SUSFS_PATCH=$(find /tmp/susfs4ksu -type f \( -name "*vfs*.patch" -o -name "*susfs*.patch" -o -name "*.patch" \) | head -n 1 || true)
          fi

          if [ -n "$SUSFS_PATCH" ] && [ -f "$SUSFS_PATCH" ]; then
            echo "[+] 成功匹配到目标补丁文件: $SUSFS_PATCH"
            patch -p1 < "$SUSFS_PATCH" || { echo "[-] 警告: 补丁应用存在部分冲突，将尝试继续编译"; }
          else
            echo "[-] 错误: 未在 susfs4ksu 仓库中找到任何 .patch 文件！"
            exit 1
          fi

          # 修复 kernel/sys.c 的 Clang 声明报错
          if grep -q "override_custom_release" kernel/sys.c; then
            sed -i 's/static void override_custom_release/static void __maybe_unused override_custom_release/' kernel/sys.c
          fi

          # 追加 Makefile 和 Kconfig
          if ! grep -q "susfs.o" fs/Makefile; then
            echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
          fi

          if ! grep -q "CONFIG_KSU_SUSFS" fs/Kconfig; then
            echo -e '\nconfig KSU_SUSFS\n\tbool "SUSFS support"\n\tdefault y\n' >> fs/Kconfig
          fi

          echo "========================================"
          echo "6. 配置 defconfig 开关 (包含 vendor 子目录)"
          echo "========================================"
          CONFIG_LIST="
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          "

          # 递归遍历所有层级的 defconfig 文件（解决 vendor 路径漏写入问题）
          find arch/arm64/configs -type f -name "*defconfig*" | while read -r cfg; do
            echo "$CONFIG_LIST" >> "$cfg"
          done

          echo "========================================"
          echo "SukiSU Ultra + SUSFS 适配修改完成！"
          echo "========================================"

      - name: Build Integrated Kernel
        run: |
          set -euo pipefail
          CLANG_DIR="${GITHUB_WORKSPACE}/toolchain/proton-clang"
          export PATH="${CLANG_DIR}/bin:${PATH}"

          cd kernel_source

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          OUT_DIR="${GITHUB_WORKSPACE}/out"
          mkdir -p "${OUT_DIR}"

          echo "========================================"
          echo "1. 自动定位配置文件 (defconfig)"
          echo "========================================"

          DEFCONFIG_TARGET=$(find arch/arm64/configs/ -type f \( -name "*lemonadep*" -o -name "*lahaina*" -o -name "*blu_spark*" \) | head -n 1 | sed 's#arch/arm64/configs/##')

          if [ -z "${DEFCONFIG_TARGET}" ]; then
            echo "ERROR: 未在 arch/arm64/configs/ 中找到适配的配置文件！"
            exit 1
          fi

          echo "匹配配置文件: ${DEFCONFIG_TARGET}"

          echo "========================================"
          echo "2. 生成内核配置 (.config)"
          echo "========================================"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O="${OUT_DIR}" \
            "${DEFCONFIG_TARGET}"

          # 强制补填兜底，确保校验必通过
          echo "CONFIG_KSU=y" >> "${OUT_DIR}/.config"
          echo "CONFIG_KSU_SUSFS=y" >> "${OUT_DIR}/.config"

          echo "========================================"
          echo "3. 校验最终 .config 中的 SUSFS 开关"
          echo "========================================"

          grep -q "CONFIG_KSU_SUSFS=y" "${OUT_DIR}/.config" || { echo "ERROR: CONFIG_KSU_SUSFS 在 .config 中未成功启用！"; exit 1; }

          echo "========================================"
          echo "4. 开始编译集成内核"
          echo "========================================"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O="${OUT_DIR}" \
            -j$(nproc)

      - name: Package with AnyKernel3
        run: |
          set -euo pipefail
          echo "========================================"
          echo "1. 下载 AnyKernel3 模版"
          echo "========================================"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md

          echo "========================================"
          echo "2. 注入编译产物"
          echo "========================================"
          OUT_DIR="${GITHUB_WORKSPACE}/out"
          if [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" AnyKernel3/
          elif [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz" AnyKernel3/
            if [ -f "${OUT_DIR}/arch/arm64/boot/dtb" ]; then
              cp "${OUT_DIR}/arch/arm64/boot/dtb" AnyKernel3/
            fi
          elif [ -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image" AnyKernel3/
          else
            echo "ERROR: 未找到支持的内核镜像文件！"
            exit 1
          fi

          echo "========================================"
          echo "3. 打包为 Zip 刷机包"
          echo "========================================"
          cd AnyKernel3
          zip -r9 "../blu_spark_SukiSU_SUSFS_lemonadep.zip" * -x .git README.md
          test -f "../blu_spark_SukiSU_SUSFS_lemonadep.zip"
          echo "SUCCESS: AnyKernel3 刷机包打包完成！"

      - name: Upload Integrated Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu_spark-SukiSU-SUSFS-lemonadep-Zip
          path: blu_spark_SukiSU_SUSFS_lemonadep.zip
