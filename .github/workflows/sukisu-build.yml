name: Phase 2 - Integrated SukiSU Ultra + SUSFS Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: blu_spark-16-custom
          path: kernel_source
          fetch-depth: 1

      - name: Setup Proton-Clang Toolchain
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Integrate SukiSU Ultra + SUSFS
        run: |
          set -euo pipefail

          cd kernel_source

          echo "========================================"
          echo "1. 克隆 SukiSU Ultra 与 Star-Seven/susfs4ksu"
          echo "========================================"

          rm -rf /tmp/SukiSU-Ultra /tmp/susfs4ksu
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git /tmp/SukiSU-Ultra

          SUSFS_BRANCH=$(git ls-remote --heads https://github.com/Star-Seven/susfs4ksu.git | grep -i '5\.4' | head -n 1 | awk '{print $2}' | sed 's#refs/heads/##' || true)

          if [ -n "${SUSFS_BRANCH}" ]; then
            echo "[+] 成功定位到 SUSFS 目标分支: ${SUSFS_BRANCH}"
            git clone --depth=1 -b "${SUSFS_BRANCH}" https://github.com/Star-Seven/susfs4ksu.git /tmp/susfs4ksu
          else
            echo "[+] 未找到包含 5.4 字样的独立分支，直接拉取 susfs4ksu 默认主分支"
            git clone --depth=1 https://github.com/Star-Seven/susfs4ksu.git /tmp/susfs4ksu
          fi

          echo "========================================"
          echo "2. 还原 DTS 目录，保持源码原始格式"
          echo "========================================"

          if [ -d "arch/arm64/boot/dts/vendor/oplus" ]; then
            echo "[+] 恢复 vendor/oplus 目录至干净状态"
            git checkout -- arch/arm64/boot/dts/vendor/oplus/ || true
          fi

          echo "========================================"
          echo "3. 植入 SukiSU Ultra 驱动与 5.4 全局 API 适配"
          echo "========================================"

          bash /tmp/SukiSU-Ultra/kernel/setup.sh main

          # 1) 自动补齐 5.4 内核缺失的 linux/pgtable.h
          if [ ! -f "include/linux/pgtable.h" ]; then
            echo "[+] 创建 linux/pgtable.h 兼容垫片"
            mkdir -p include/linux
            echo -e "#ifndef _LINUX_PGTABLE_H\n#define _LINUX_PGTABLE_H\n#include <asm/pgtable.h>\n#endif" > include/linux/pgtable.h
          fi

          # 2) 穿透软链接定位 pkg_observer.c 并修复 5.4 fsnotify 接口
          RAW_OBSERVER=$(find -L drivers/kernelsu /tmp/SukiSU-Ultra -name "pkg_observer.c" 2>/dev/null | head -n 1 || true)
          if [ -n "$RAW_OBSERVER" ]; then
            PKG_OBSERVER=$(readlink -f "$RAW_OBSERVER")
            echo "[+] 找到 pkg_observer.c 真实物理路径: $PKG_OBSERVER"
            if [ -f "$PKG_OBSERVER" ] && grep -q "handle_inode_event" "$PKG_OBSERVER"; then
              echo "[+] 修改 $PKG_OBSERVER 以适配 Linux 5.4 fsnotify 结构体"
              sed -i '/struct fsnotify_ops/i static int ksu_handle_event(struct fsnotify_group *group, struct inode *to_tell, u32 mask, const void *data, int data_type, const struct qstr *file_name, u32 cookie, struct fsnotify_iter_info *iter_info) { return ksu_handle_inode_event(NULL, mask, to_tell, NULL, file_name, cookie); }' "$PKG_OBSERVER"
              sed -i 's/.*\.handle_inode_event.*/\t\.handle_event = ksu_handle_event,/' "$PKG_OBSERVER"
            fi
          fi

          # 3) 穿透软链接定位 allowlist.c 并修复 Linux 5.4 下的 TWA_RESUME 与 put_task_struct 声明
          RAW_ALLOWLIST=$(find -L drivers/kernelsu /tmp/SukiSU-Ultra -name "allowlist.c" 2>/dev/null | head -n 1 || true)
          if [ -n "$RAW_ALLOWLIST" ]; then
            ALLOWLIST=$(readlink -f "$RAW_ALLOWLIST")
            echo "[+] 找到 allowlist.c 真实物理路径: $ALLOWLIST"
            if [ -f "$ALLOWLIST" ]; then
              echo "[+] 修复 $ALLOWLIST 的 Linux 5.4 TWA_RESUME 与 put_task_struct 缺失"
              sed -i '1i #include <linux/sched/task.h>\n#include <linux/task_work.h>\n#ifndef TWA_RESUME\n#define TWA_RESUME true\n#endif' "$ALLOWLIST"
            fi
          fi

          # 4) 穿透软链接定位 selinux 目录，修复 Linux 5.4 下 struct selinux_state 缺失 policy 成员报错
          SELINUX_DIR=$(find -L drivers/kernelsu /tmp/SukiSU-Ultra -type d -name "selinux" 2>/dev/null | head -n 1 || true)
          if [ -n "$SELINUX_DIR" ]; then
            REAL_SELINUX=$(readlink -f "$SELINUX_DIR")
            echo "[+] 找到 selinux 真实物理路径: $REAL_SELINUX"
            echo "[+] 将 SELinux 模块中的 policy 成员替换为 Linux 5.4 的 ss 成员"
            sed -i 's/->policy/->ss/g; s/\.policy/\.ss/g' "$REAL_SELINUX"/*.c "$REAL_SELINUX"/*.h 2>/dev/null || true
          fi

          echo "========================================"
          echo "4. 从 susfs4ksu 提取完整核心源码"
          echo "========================================"

          find /tmp/susfs4ksu -name "susfs.c" -exec cp {} fs/ \;
          find /tmp/susfs4ksu -name "susfs*.h" -exec cp {} include/linux/ \;

          echo "========================================"
          echo "5. 智能定位并应用 5.4 内核 SUSFS Patch"
          echo "========================================"

          echo "[+] 正在搜寻仓库中的 Patch 文件..."
          find /tmp/susfs4ksu -type f -name "*.patch" || true

          # 优先匹配路径或文件名带 5.4 的 patch
          SUSFS_PATCH=$(find /tmp/susfs4ksu -type f \( -path "*5.4*" -o -name "*5.4*" \) -name "*.patch" | head -n 1 || true)

          # 若未找到则退而求其次寻找包含 vfs 的 patch
          if [ -z "$SUSFS_PATCH" ]; then
            SUSFS_PATCH=$(find /tmp/susfs4ksu -type f -name "*vfs*.patch" | head -n 1 || true)
          fi

          if [ -n "$SUSFS_PATCH" ] && [ -f "$SUSFS_PATCH" ]; then
            echo "[+] 成功定位目标 Patch: $SUSFS_PATCH"
            patch -p1 --forward < "$SUSFS_PATCH" || {
              echo "[-] 警告: Patch 部分未完全对齐，列出产生的冲突 .rej 文件："
              find . -name "*.rej" || true
            }
          else
            echo "[!] 未在仓库中找到任何 Patch 文件，跳过 patch 步骤"
          fi

          # 修复 Clang 下 override_custom_release -Werror=unused-function 报错
          if grep -q "override_custom_release" kernel/sys.c; then
            echo "[+] 为 kernel/sys.c 添加 __maybe_unused 修复 Clang 编译报错"
            sed -i 's/static void override_custom_release/static void __maybe_unused override_custom_release/' kernel/sys.c
          fi

          if ! grep -q "susfs.o" fs/Makefile; then
            echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
          fi

          if ! grep -q "CONFIG_KSU_SUSFS" fs/Kconfig; then
            echo -e '\nconfig KSU_SUSFS\n\tbool "SUSFS support"\n\tdefault y\n' >> fs/Kconfig
          fi

          echo "========================================"
          echo "6. 严格断言（Assert）核心文件"
          echo "========================================"

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h
          test -f include/linux/pgtable.h

          echo "========================================"
          echo "7. 追加 SUSFS 编译开关至 defconfig"
          echo "========================================"

          CONFIG_LIST="
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          "

          for cfg in arch/arm64/configs/*defconfig*; do
            if [ -f "$cfg" ]; then
              echo "$CONFIG_LIST" >> "$cfg"
            fi
          done

          echo "========================================"
          echo "SukiSU Ultra + SELinux 适配完成！"
          echo "========================================"
          
      - name: Build Integrated Kernel
        run: |
          set -euo pipefail

          CLANG_DIR="${GITHUB_WORKSPACE}/toolchain/proton-clang"
          export PATH="${CLANG_DIR}/bin:${PATH}"

          cd kernel_source

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          OUT_DIR="${GITHUB_WORKSPACE}/out"
          mkdir -p "${OUT_DIR}"

          echo "========================================"
          echo "1. 自动定位配置文件 (defconfig)"
          echo "========================================"

          DEFCONFIG_TARGET=$(find arch/arm64/configs/ -type f \( -name "*lemonadep*" -o -name "*lahaina*" -o -name "*blu_spark*" \) | head -n 1 | sed 's#arch/arm64/configs/##')

          if [ -z "${DEFCONFIG_TARGET}" ]; then
            echo "ERROR: 未在 arch/arm64/configs/ 中找到适配的配置文件！"
            exit 1
          fi

          echo "匹配配置文件: ${DEFCONFIG_TARGET}"

          echo "========================================"
          echo "2. 生成内核配置 (.config)"
          echo "========================================"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O="${OUT_DIR}" \
            "${DEFCONFIG_TARGET}"

          echo "========================================"
          echo "3. 校验最终 .config 中的 SUSFS 开关"
          echo "========================================"

          grep -q "CONFIG_KSU_SUSFS=y" "${OUT_DIR}/.config" || { echo "ERROR: CONFIG_KSU_SUSFS 在 .config 中未成功启用！"; exit 1; }

          echo "========================================"
          echo "4. 开始编译集成内核"
          echo "========================================"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O="${OUT_DIR}" \
            -j$(nproc)

      - name: Package with AnyKernel3
        run: |
          set -euo pipefail

          echo "========================================"
          echo "1. 下载 AnyKernel3 模版"
          echo "========================================"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md

          echo "========================================"
          echo "2. 注入编译产物"
          echo "========================================"

          OUT_DIR="${GITHUB_WORKSPACE}/out"

          if [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" AnyKernel3/
          elif [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz" AnyKernel3/
            if [ -f "${OUT_DIR}/arch/arm64/boot/dtb" ]; then
              cp "${OUT_DIR}/arch/arm64/boot/dtb" AnyKernel3/
            fi
          elif [ -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image" AnyKernel3/
          else
            echo "ERROR: 未找到支持的内核镜像文件！"
            exit 1
          fi

          echo "========================================"
          echo "3. 打包为 Zip 刷机包"
          echo "========================================"

          cd AnyKernel3
          zip -r9 "../blu_spark_SukiSU_SUSFS_lemonadep.zip" * -x .git README.md

          test -f "../blu_spark_SukiSU_SUSFS_lemonadep.zip"
          echo "SUCCESS: AnyKernel3 刷机包打包完成！"

      - name: Upload Integrated Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu_spark-SukiSU-SUSFS-lemonadep-Zip
          path: blu_spark_SukiSU_SUSFS_lemonadep.zip
