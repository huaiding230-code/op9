name: Phase 2 - Integrated SukiSU Ultra + SUSFS Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: blu_spark-16-custom
          path: kernel_source
          fetch-depth: 1

      - name: Setup Proton-Clang Toolchain
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Integrate SukiSU Ultra + SUSFS
        run: |
          set -euo pipefail

          cd kernel_source

          echo "========================================"
          echo "1. 克隆 SukiSU Ultra 官方仓库"
          echo "========================================"

          rm -rf /tmp/SukiSU-Ultra
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git /tmp/SukiSU-Ultra

          echo "========================================"
          echo "2. 植入 KernelSU 基础驱动"
          echo "========================================"

          bash /tmp/SukiSU-Ultra/kernel/setup.sh main

          echo "========================================"
          echo "3. 提取 SUSFS 源码并打入 VFS 补丁"
          echo "========================================"

          # 1. 复制 susfs.c 和 susfs.h 到内核源码目录
          find /tmp/SukiSU-Ultra -name "susfs.c" -exec cp {} fs/ \;
          find /tmp/SukiSU-Ultra -name "susfs.h" -exec cp {} include/linux/ \;

          # 2. 寻找 5.4 内核的 SUSFS patch 并应用
          SUSFS_PATCH=$(find /tmp/SukiSU-Ultra -type f \( -name "*5.4*.patch" -o -name "*susfs*.patch" \) | head -n 1 || true)

          if [ -n "$SUSFS_PATCH" ] && [ -f "$SUSFS_PATCH" ]; then
            echo "应用 SUSFS 补丁文件: $SUSFS_PATCH"
            patch -p1 < "$SUSFS_PATCH" || { echo "WARNING: Patch 自动对齐有部分冲突，尝试忽略冲突并继续"; }
          else
            echo "未找到独立 patch 文件，直接补全 Makefile 与 Kconfig 引用"
          fi

          # 3. 确保 fs/Makefile 包含 susfs.o 编译项
          if ! grep -q "susfs.o" fs/Makefile; then
            echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
          fi

          # 4. 确保 fs/Kconfig 包含 SUSFS 配置
          if ! grep -q "CONFIG_KSU_SUSFS" fs/Kconfig; then
            sed -i '/endmenu/d' fs/Kconfig || true
            echo -e 'config KSU_SUSFS\n\tbool "SUSFS support"\n\tdefault y' >> fs/Kconfig
            echo 'endmenu' >> fs/Kconfig
          fi

          echo "========================================"
          echo "4. 校验 SUSFS 核心文件与挂载点"
          echo "========================================"

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -d drivers/kernelsu

          echo "========================================"
          echo "5. 追加 SUSFS 编译参数到 defconfig"
          echo "========================================"

          CONFIG_LIST="
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          "

          for cfg in arch/arm64/configs/*defconfig*; do
            if [ -f "$cfg" ]; then
              echo "$CONFIG_LIST" >> "$cfg"
            fi
          done

          echo "========================================"
          echo "SukiSU Ultra + SUSFS 准备就绪！"
          echo "========================================"
          
      - name: Build Integrated Kernel
        run: |
          set -euo pipefail

          CLANG_DIR="${GITHUB_WORKSPACE}/toolchain/proton-clang"
          export PATH="${CLANG_DIR}/bin:${PATH}"

          cd kernel_source

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          OUT_DIR="${GITHUB_WORKSPACE}/out"
          mkdir -p "${OUT_DIR}"

          echo "========================================"
          echo "1. 自动定位配置文件 (defconfig)"
          echo "========================================"

          DEFCONFIG_TARGET=$(find arch/arm64/configs/ -type f \( -name "*lemonadep*" -o -name "*lahaina*" -o -name "*blu_spark*" \) | head -n 1 | sed 's#arch/arm64/configs/##')

          if [ -z "${DEFCONFIG_TARGET}" ]; then
            echo "ERROR: 未在 arch/arm64/configs/ 中找到适配的配置文件！"
            exit 1
          fi

          echo "匹配配置文件: ${DEFCONFIG_TARGET}"

          echo "========================================"
          echo "2. 生成内核配置 (.config)"
          echo "========================================"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O="${OUT_DIR}" \
            "${DEFCONFIG_TARGET}"

          echo "========================================"
          echo "3. 校验最终 .config 中的 SUSFS 开关"
          echo "========================================"

          grep -q "CONFIG_KSU_SUSFS=y" "${OUT_DIR}/.config" || { echo "ERROR: CONFIG_KSU_SUSFS 在 .config 中未成功启用！"; exit 1; }

          echo "========================================"
          echo "4. 开始编译集成内核"
          echo "========================================"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O="${OUT_DIR}" \
            -j$(nproc)

      - name: Package with AnyKernel3
        run: |
          set -euo pipefail

          echo "========================================"
          echo "1. 下载 AnyKernel3 模版"
          echo "========================================"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md

          echo "========================================"
          echo "2. 注入编译产物"
          echo "========================================"

          OUT_DIR="${GITHUB_WORKSPACE}/out"

          if [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" AnyKernel3/
          elif [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz" AnyKernel3/
            if [ -f "${OUT_DIR}/arch/arm64/boot/dtb" ]; then
              cp "${OUT_DIR}/arch/arm64/boot/dtb" AnyKernel3/
            fi
          elif [ -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image" AnyKernel3/
          else
            echo "ERROR: 未找到支持的内核镜像文件！"
            exit 1
          fi

          echo "========================================"
          echo "3. 打包为 Zip 刷机包"
          echo "========================================"

          cd AnyKernel3
          zip -r9 "../blu_spark_SukiSU_SUSFS_lemonadep.zip" * -x .git README.md

          test -f "../blu_spark_SukiSU_SUSFS_lemonadep.zip"
          echo "SUCCESS: AnyKernel3 刷机包打包完成！"

      - name: Upload Integrated Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu_spark-SukiSU-SUSFS-lemonadep-Zip
          path: blu_spark_SukiSU_SUSFS_lemonadep.zip
