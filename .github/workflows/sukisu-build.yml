name: Phase 2 - Integrated SukiSU Ultra + SUSFS Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: blu_spark-16-custom
          path: kernel_source
          fetch-depth: 1

      - name: Setup Proton-Clang Toolchain
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/huaiding230-code/proton-clang.git toolchain/proton-clang
          echo "${GITHUB_WORKSPACE}/toolchain/proton-clang/bin" >> $GITHUB_PATH

      - name: Integrate SukiSU Ultra + SUSFS
        run: |
          set -euo pipefail
          cd kernel_source

          echo "========================================"
          echo "1. 克隆你个人仓库的 SukiSU Ultra 与 susfs4ksu"
          echo "========================================"
          rm -rf /tmp/SukiSU-Ultra /tmp/susfs4ksu
          git clone --depth=1 https://github.com/huaiding230-code/SukiSU-Ultra.git /tmp/SukiSU-Ultra
          git clone --depth=1 https://github.com/huaiding230-code/susfs4ksu.git /tmp/susfs4ksu

          echo "========================================"
          echo "2. 清理 dts 设备树冲突节点"
          echo "========================================"
          git checkout -- arch/arm64/boot/dts/ || true
          if [ -f "arch/arm64/boot/dts/vendor/oplus/lemonadev/Makefile" ]; then
            echo "obj-y :=" > arch/arm64/boot/dts/vendor/oplus/lemonadev/Makefile
          fi

          echo "========================================"
          echo "3. 执行你专门修改过的 setup.sh"
          echo "========================================"
          bash /tmp/SukiSU-Ultra/kernel/setup.sh

          echo "========================================"
          echo "4. 从 susfs4ksu 注入 SUSFS 模块与 5.4 Patch"
          echo "========================================"
          SUSFS_C=$(find /tmp/susfs4ksu -name "susfs.c" | head -n 1)
          if [ -n "$SUSFS_C" ]; then
            cp "$SUSFS_C" fs/
          else
            echo "[-] 错误: 未找到 susfs.c" && exit 1
          fi
          find /tmp/susfs4ksu -name "susfs*.h" -exec cp {} include/linux/ \;

          if [ -f "patch/50_add_susfs_in_kernel-5.4.patch" ]; then
            patch -p1 --batch -N --fuzz=3 --ignore-whitespace < patch/50_add_susfs_in_kernel-5.4.patch || true
          else
            echo "[-] 错误: 未找到 50_add_susfs_in_kernel-5.4.patch！" && exit 1
          fi

          if ! grep -q "susfs.o" fs/Makefile; then
            echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
          fi
          if ! grep -q "CONFIG_KSU_SUSFS" fs/Kconfig; then
            echo -e '\nconfig KSU_SUSFS\n\tbool "SUSFS support"\n\tdefault y\n' >> fs/Kconfig
          fi

      - name: Apply Linux 5.4 Global Compatibility Engine
        run: |
          set -euo pipefail
          cd kernel_source

          echo "========================================"
          echo "1. 植入 5.4 全局 C 语言预定义头文件"
          echo "========================================"
          mkdir -p drivers/kernelsu
          cat << 'EOF' > drivers/kernelsu/ksu_compat.h
          #ifndef _KSU_COMPAT_H
          #define _KSU_COMPAT_H
          
          #include <linux/version.h>
          #include <linux/types.h>
          #include <linux/kernel.h>
          #include <asm/pgtable.h>
          #include <linux/sched/task.h>
          #include <linux/task_work.h>
          
          #ifndef TWA_RESUME
          #define TWA_RESUME true
          #endif
          
          #endif /* _KSU_COMPAT_H */
          EOF

          KSU_MAKEFILE=$(find -L drivers/kernelsu -name "Makefile" 2>/dev/null | head -n 1 || true)
          if [ -n "$KSU_MAKEFILE" ] && [ -f "$KSU_MAKEFILE" ]; then
            sed -i '1i ccflags-y += -include $(srctree)/drivers/kernelsu/ksu_compat.h' "$KSU_MAKEFILE"
          fi

          echo "========================================"
          echo "2. 重构 pkg_observer.c (替换为 5.4 干净存根)"
          echo "========================================"
          PKG_OBS=$(find -L drivers/kernelsu -name "pkg_observer.c" 2>/dev/null | head -n 1 || true)
          [ -z "$PKG_OBS" ] && [ -f "KernelSU/kernel/manager/pkg_observer.c" ] && PKG_OBS="KernelSU/kernel/manager/pkg_observer.c"
          if [ -n "$PKG_OBS" ] && [ -f "$PKG_OBS" ]; then
            cat << 'EOF' > "$PKG_OBS"
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/module.h>
          int ksu_observer_init(void) { return 0; }
          void ksu_observer_exit(void) {}
          EOF
          fi

          echo "========================================"
          echo "3. 重构 sepolicy.c (精确花括号计数，完全屏蔽 5.4 报错片段)"
          echo "========================================"
          SEPOLICY_C=$(find -L drivers/kernelsu -name "sepolicy.c" 2>/dev/null | head -n 1 || true)
          [ -z "$SEPOLICY_C" ] && [ -f "KernelSU/kernel/selinux/sepolicy.c" ] && SEPOLICY_C="KernelSU/kernel/selinux/sepolicy.c"
          if [ -n "$SEPOLICY_C" ] && [ -f "$SEPOLICY_C" ]; then
            awk '
            BEGIN { in_func = 0; b_level = 0; found = 0 }
            /ksu_add_filename_trans/ && !/;/ && !in_func {
                in_func = 1
                print "#if 0"
                print $0
                for(i=1; i<=length($0); i++) {
                    c = substr($0, i, 1)
                    if(c == "{") { b_level++; found = 1 }
                    if(c == "}") { b_level-- }
                }
                if(found && b_level == 0) {
                    in_func = 0; found = 0
                    print "#endif\nint ksu_add_filename_trans(void* a, void* b, void* c, void* d, void* e) { return 0; }"
                }
                next
            }
            in_func {
                print $0
                for(i=1; i<=length($0); i++) {
                    c = substr($0, i, 1)
                    if(c == "{") { b_level++; found = 1 }
                    if(c == "}") { b_level-- }
                }
                if(found && b_level == 0) {
                    in_func = 0; found = 0
                    print "#endif\nint ksu_add_filename_trans(void* a, void* b, void* c, void* d, void* e) { return 0; }"
                }
                next
            }
            { print $0 }
            ' "$SEPOLICY_C" > "${SEPOLICY_C}.tmp" && mv "${SEPOLICY_C}.tmp" "$SEPOLICY_C"
          fi

          echo "========================================"
          echo "4. 全局修正 SELinux 成员名与头文件引用"
          echo "========================================"
          find -L drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) 2>/dev/null | while read -r raw_f; do
            f=$(readlink -f "$raw_f" 2>/dev/null || echo "$raw_f")
            if [ -f "$f" ]; then
              sed -i 's/\bselinux_policy\b/selinux_ss/g' "$f"
              sed -i 's/selinux_state\.policy\b/selinux_state.ss/g' "$f"
              sed -i 's/mutex_lock(&selinux_state\.policy_mutex);/(void)0;/g' "$f"
              sed -i 's/mutex_unlock(&selinux_state\.policy_mutex);/(void)0;/g' "$f"
            fi
          done

          find -L drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's#<linux/pgtable.h>#<asm/pgtable.h>#g' {} +

          echo "========================================"
          echo "5. 全局清理 Makefile 中的 -Werror 与源码缺陷"
          echo "========================================"
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/\b-Werror\b/ /g' {} + || true

          if [ -f "kernel/sched/fair.c" ]; then
            sed -i -E 's/static_branch_unlikely\([[:space:]]*&sched_energy_present[[:space:]]*\)/sched_energy_enabled()/g' kernel/sched/fair.c
            sed -i 's/&sched_energy_present/NULL/g' kernel/sched/fair.c
          fi

          if [ -f "drivers/iommu/iommu-debug.c" ]; then
            sed -i '1i #ifndef CONFIG_IOMMU_IOVA_ALIGNMENT\n#define CONFIG_IOMMU_IOVA_ALIGNMENT 0\n#endif' drivers/iommu/iommu-debug.c
          fi

      - name: Build Integrated Kernel
        run: |
          set -euo pipefail
          cd kernel_source

          CLANG_DIR="${GITHUB_WORKSPACE}/toolchain/proton-clang"
          export PATH="${CLANG_DIR}/bin:${PATH}"

          OUT_DIR="${GITHUB_WORKSPACE}/out"
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

          echo "========================================"
          echo "1. 精准解锁 Kconfig 隐式配置限制 (防 multiple types)"
          echo "========================================"
          if [ -f "net/core/Kconfig" ]; then
            sed -i 's/^config RPS$/config RPS\n\tprompt "Receive Packet Steering"/g' net/core/Kconfig
          fi

          echo "========================================"
          echo "2. 定位并配置 Target Defconfig"
          echo "========================================"
          DEFCONFIG_TARGET=$(find arch/arm64/configs/ -type f \( -name "*lemonadep*" -o -name "*lahaina*" -o -name "*blu_spark*" \) | head -n 1 | sed 's#arch/arm64/configs/##')
          if [ -z "${DEFCONFIG_TARGET}" ]; then
            echo "ERROR: 未在 arch/arm64/configs/ 中找到配置文件！"
            exit 1
          fi
          echo "匹配配置文件: ${DEFCONFIG_TARGET}"

          MAKE_ARGS=(
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC=clang
            KCFLAGS="-Wno-error -Wno-return-type -Wno-unused-function -Wno-implicit-function-declaration -Wno-int-conversion"
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            O="${OUT_DIR}"
          )

          make "${MAKE_ARGS[@]}" "${DEFCONFIG_TARGET}"

          echo "========================================"
          echo "3. 注入高优先级 Config"
          echo "========================================"
          CONFIG_TOOL="scripts/config"
          if [ -f "${CONFIG_TOOL}" ]; then
            chmod +x "${CONFIG_TOOL}"
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_RPS
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_PERF_EVENTS
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_HW_PERF_EVENTS
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KEYS
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_SUS_PATH
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_SUS_MOUNT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_SUS_KSTAT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_TRY_UMOUNT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_ENABLE_LOG
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_MEDIA_CONTROLLER
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_BLK_INLINE_ENCRYPTION
          fi

          make "${MAKE_ARGS[@]}" olddefconfig

          echo "========================================"
          echo "4. 核心配置依赖性强校验"
          echo "========================================"
          grep -q "CONFIG_RPS=y" "${OUT_DIR}/.config" || { echo "ERROR: CONFIG_RPS 未启用！"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS=y" "${OUT_DIR}/.config" || { echo "ERROR: CONFIG_KSU_SUSFS 未启用！"; exit 1; }

          echo "========================================"
          echo "5. 执行内核编译"
          echo "========================================"
          make "${MAKE_ARGS[@]}" -j$(nproc)

      - name: Package with AnyKernel3
        run: |
          set -euo pipefail
          echo "========================================"
          echo "1. 下载你个人仓库的 AnyKernel3 模版"
          echo "========================================"
          git clone --depth=1 https://github.com/huaiding230-code/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md

          echo "========================================"
          echo "2. 提取编译产物"
          echo "========================================"
          OUT_DIR="${GITHUB_WORKSPACE}/out"
          if [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" AnyKernel3/
          elif [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz" AnyKernel3/
            if [ -f "${OUT_DIR}/arch/arm64/boot/dtb" ]; then
              cp "${OUT_DIR}/arch/arm64/boot/dtb" AnyKernel3/
            fi
          elif [ -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image" AnyKernel3/
          else
            echo "ERROR: 未找到支持的内核镜像文件！"
            exit 1
          fi

          echo "========================================"
          echo "3. 打包刷机包"
          echo "========================================"
          cd AnyKernel3
          zip -r9 "../blu_spark_SukiSU_SUSFS_lemonadep.zip" * -x .git README.md
          test -f "../blu_spark_SukiSU_SUSFS_lemonadep.zip"
          echo "SUCCESS: 打包完成！"

      - name: Upload Integrated Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu_spark_SukiSU_SUSFS_lemonadep
          path: blu_spark_SukiSU_SUSFS_lemonadep.zip
