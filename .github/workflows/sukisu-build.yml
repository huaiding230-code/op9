name: Phase 2 - Integrated SukiSU Ultra + SUSFS Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: blu_spark-16-custom
          path: kernel_source
          fetch-depth: 1
          

      - name: Setup Proton-Clang Toolchain
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/huaiding230-code/proton-clang.git toolchain/proton-clang
          echo "${GITHUB_WORKSPACE}/toolchain/proton-clang/bin" >> $GITHUB_PATH

      - name: Integrate SukiSU Ultra + SUSFS
        run: |
          set -euo pipefail
          cd kernel_source

          echo "========================================"
          echo "1. 克隆你个人仓库的 SukiSU Ultra 与 susfs4ksu"
          echo "========================================"
          rm -rf /tmp/SukiSU-Ultra /tmp/susfs4ksu
          git clone --depth=1 https://github.com/huaiding230-code/SukiSU-Ultra.git /tmp/SukiSU-Ultra
          git clone --depth=1 https://github.com/huaiding230-code/susfs4ksu.git /tmp/susfs4ksu

          echo "========================================"
          echo "2. 清理 dts 设备树冲突节点"
          echo "========================================"
          git checkout -- arch/arm64/boot/dts/ || true
          
          echo "========================================"
          echo "3. 执行你魔改过的 setup.sh (全权交由你的库处理)"
          echo "========================================"
          bash /tmp/SukiSU-Ultra/kernel/setup.sh

          echo "========================================"
          echo "4. 从 susfs4ksu 注入 SUSFS 模块与 5.4 Patch"
          echo "========================================"
          SUSFS_C=$(find /tmp/susfs4ksu -name "susfs.c" | head -n 1)
          if [ -n "$SUSFS_C" ]; then
            cp "$SUSFS_C" fs/
          else
            echo "[-] 错误: 未找到 susfs.c" && exit 1
          fi
          find /tmp/susfs4ksu -name "susfs*.h" -exec cp {} include/linux/ \;

          if ! grep -q "susfs.o" fs/Makefile; then
            echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
          fi
          if ! grep -q "CONFIG_KSU_SUSFS" fs/Kconfig; then
            echo -e '\nconfig KSU_SUSFS\n\tbool "SUSFS support"\n\tdefault y\n' >> fs/Kconfig
          fi

      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-    

      - name: Build Integrated Kernel
        
        run: |
          set -euo pipefail
          cd kernel_source
          CLANG_DIR="${GITHUB_WORKSPACE}/toolchain/proton-clang"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          OUT_DIR="${GITHUB_WORKSPACE}/out"
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"
  
          echo "========================================"
          echo "1. 精准解锁 Kconfig 隐式配置限制 (防 multiple types)"
          echo "========================================"
          if [ -f "net/core/Kconfig" ]; then
            sed -i 's/^config RPS$/config RPS\n\tprompt "Receive Packet Steering"/g' net/core/Kconfig
          fi
  
          echo "========================================"
          echo "2. 定位并配置 Target Defconfig"
          echo "========================================"
          DEFCONFIG_TARGET=$(find arch/arm64/configs/ -type f \( -name "*lemonadep*" -o -name "*lahaina*" -o -name "*blu_spark*" \) | head -n 1 | sed 's#arch/arm64/configs/##')
          if [ -z "${DEFCONFIG_TARGET}" ]; then
            echo "ERROR: 未在 arch/arm64/configs/ 中找到配置文件！"
            exit 1
          fi
          echo "匹配配置文件: ${DEFCONFIG_TARGET}"
  
          MAKE_ARGS=(
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC="ccache clang"
            KCFLAGS="-Wno-error -Wno-return-type -Wno-unused-function -Wno-implicit-function-declaration -Wno-int-conversion"
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            O="${OUT_DIR}"
          )
  
          make "${MAKE_ARGS[@]}" "${DEFCONFIG_TARGET}"
  
          echo "========================================"
          echo "3. 注入高优先级 Config 及其依赖项"
          echo "========================================"
          CONFIG_TOOL="scripts/config"
          if [ -f "${CONFIG_TOOL}" ]; then
            chmod +x "${CONFIG_TOOL}"
            
            # --- 1. 基础网络与核心功能 ---
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_NET
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_INET
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_RPS
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_PERF_EVENTS
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_HW_PERF_EVENTS
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KEYS
            
            # --- 2. SukiSU & SUSFS 隐匿与功能配置 ---
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_SUS_PATH
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_SUS_MOUNT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_SUS_KSTAT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_TRY_UMOUNT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_ENABLE_LOG
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SPOOF_CPU
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SELINUX_HIDE
            
            # --- 3. 高通 QTI 核心平台、SoC与共享内存底层完整依赖链 ---
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_ARCH_QCOM
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_QCOM_SOCINFO
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_QCOM_COMMAND_DB
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_QCOM_RPMH
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_QCOM_RPMHPD
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_QCOM_SMEM
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_QCOM_SMEM_STATE
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_QCOM_SMEM_MBOX
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_RPMSG
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_RPMSG_CHAR
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_QRTR
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_QCOM_QMI_HELPERS
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_HWSPINLOCK
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_HWSPINLOCK_QCOM

            # --- 4. 高通 QTI 加密、存储与 DMA ---
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_MEDIA_CONTROLLER
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_BLK_INLINE_ENCRYPTION
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_CRYPTO
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_CRYPTO_LIB_MEMNEQ
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_CRYPTO_MEMNEQ
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_CRYPTO_DEV_QCOM_ICE
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_QTI_CRYPTO_COMMON
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_QTI_CRYPTO_TZ
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_DMA_SHARED_BUFFER
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_DRM_MSM_COOLING_DEV

            # --- 5. OPlus 专有驱动与机型识别完整依赖链 ---
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_OPLUS_FEATURE_KERNEL
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_OPLUS_FEATURE_LOG
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_OPLUS_SYSTEM_KERNEL

            # --- 6. 调试系统、IOMMU 与 CPU 调频 ---
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_CPU_FREQ
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_NO_HZ_IDLE
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_NO_HZ_COMMON
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_IOMMU_SUPPORT

            # --- 7. 设置数值型变量 ---
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --set-val CONFIG_IOMMU_IOVA_ALIGNMENT 9
            
          fi      

          # 统一刷新 olddefconfig，一次性生成编译所需的 autoconf.h
          make "${MAKE_ARGS[@]}" olddefconfig
          
          echo "========================================"
          echo "4. 核心配置依赖性强校验"
          echo "========================================"
          grep -q "CONFIG_RPS=y" "${OUT_DIR}/.config" || { echo "ERROR: CONFIG_RPS 未启用！"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS=y" "${OUT_DIR}/.config" || { echo "ERROR: CONFIG_KSU_SUSFS 未启用！"; exit 1; }
  
          echo "========================================"
          echo "5. 执行内核编译"
          echo "========================================"
          make "${MAKE_ARGS[@]}" -j$(nproc)
        
      - name: Package with AnyKernel3
      run: |
        set -euo pipefail

        echo "========================================"
        echo "1. 克隆 AnyKernel3 模版"
        echo "========================================"
        git clone --depth=1 https://github.com/huaiding230-code/AnyKernel3.git AnyKernel3
        rm -rf AnyKernel3/.git AnyKernel3/README.md

        echo "========================================"
        echo "2. 提取编译产物 (内核镜像 / DTB / DTBO)"
        echo "========================================"
        OUT_BOOT="${GITHUB_WORKSPACE}/out/arch/arm64/boot"

        # 提取内核主镜像
        if [ -f "${OUT_BOOT}/Image.gz-dtb" ]; then
          cp "${OUT_BOOT}/Image.gz-dtb" AnyKernel3/
          echo "[+] 已提取 Image.gz-dtb"
        elif [ -f "${OUT_BOOT}/Image.gz" ]; then
          cp "${OUT_BOOT}/Image.gz" AnyKernel3/
          echo "[+] 已提取 Image.gz"
        elif [ -f "${OUT_BOOT}/Image" ]; then
          cp "${OUT_BOOT}/Image" AnyKernel3/
          echo "[+] 已提取 Image"
        else
          echo "ERROR: 未找到任何有效的内核镜像文件！"
          exit 1
        fi

        # 独立提取 DTB 设备树
        if [ -f "${OUT_BOOT}/dtb" ]; then
          cp "${OUT_BOOT}/dtb" AnyKernel3/
          echo "[+] 已提取 dtb"
        elif [ -f "${OUT_BOOT}/dtb.img" ]; then
          cp "${OUT_BOOT}/dtb.img" AnyKernel3/dtb
          echo "[+] 已提取 dtb.img"
        fi

        # 提取 DTBO (若存在)
        if [ -f "${OUT_BOOT}/dtbo.img" ]; then
          cp "${OUT_BOOT}/dtbo.img" AnyKernel3/
          echo "[+] 已提取 dtbo.img"
        fi

        echo "========================================"
        echo "3. 执行 Zip 打包"
        echo "========================================"
        ZIP_NAME="blu_spark_SukiSU_SUSFS_lemonadep.zip"
        cd AnyKernel3
        zip -r9 "../${ZIP_NAME}" * -x ".git*" "README.md"
        cd ..

        echo "========================================"
        echo "4. 校验生成的刷机包"
        echo "========================================"
        if [ -f "${ZIP_NAME}" ]; then
          echo "SUCCESS: 刷机包成功生成！大小: $(du -h "${ZIP_NAME}" | cut -f1)"
        else
          echo "ERROR: 刷机包生成失败！"
          exit 1
        fi
